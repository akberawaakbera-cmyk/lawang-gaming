<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Lawang-gaming</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111827;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at center,
      #374151 0%,
      #1f2937 45%,
      #111827 100%);
}

/* =========================
   TOP BAR
========================= */

#topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 55px;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 14px;

  background: rgba(0,0,0,0.55);
  color: white;
}

.logo {
  font-size: 18px;
  font-weight: bold;
}

.stats {
  font-size: 13px;
}

/* =========================
   PLAYER
========================= */

#player {
  position: absolute;

  width: 42px;
  height: 42px;

  left: 50%;
  top: 55%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: #2563eb;
  border: 3px solid white;

  z-index: 10;
}

/* =========================
   TARGETS
========================= */

.target {
  position: absolute;

  width: 42px;
  height: 70px;

  border-radius: 12px;

  background: #ef4444;
  border: 3px solid white;

  z-index: 5;
}

.target::before {
  content: "";

  position: absolute;

  width: 34px;
  height: 34px;

  left: 50%;
  top: -22px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: #fbbf24;
  border: 3px solid white;
}

.target.hit {
  opacity: 0.25;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 34px;
  height: 34px;

  transform: translate(-50%, -50%);

  z-index: 30;

  pointer-events: none;
}

#crosshair::before,
#crosshair::after {
  content: "";

  position: absolute;

  background: white;
}

#crosshair::before {
  width: 34px;
  height: 2px;

  left: 0;
  top: 16px;
}

#crosshair::after {
  width: 2px;
  height: 34px;

  left: 16px;
  top: 0;
}

/* =========================
   CONTROLS
========================= */

.control {
  position: absolute;

  z-index: 40;

  border: none;

  border-radius: 50%;

  color: white;

  background: rgba(0,0,0,0.55);

  border: 2px solid rgba(255,255,255,0.5);

  font-weight: bold;

  user-select: none;
}

#up {
  left: 75px;
  bottom: 125px;

  width: 55px;
  height: 55px;
}

#down {
  left: 75px;
  bottom: 15px;

  width: 55px;
  height: 55px;
}

#left {
  left: 15px;
  bottom: 70px;

  width: 55px;
  height: 55px;
}

#right {
  left: 135px;
  bottom: 70px;

  width: 55px;
  height: 55px;
}

/* =========================
   ACTION BUTTONS
========================= */

.action {
  position: absolute;

  z-index: 40;

  border: none;

  border-radius: 50%;

  color: white;

  background: rgba(0,0,0,0.65);

  border: 2px solid rgba(255,255,255,0.5);

  font-weight: bold;
}

#fire {
  right: 25px;
  bottom: 45px;

  width: 82px;
  height: 82px;

  background: rgba(220,38,38,0.8);

  font-size: 17px;
}

#reload {
  right: 125px;
  bottom: 35px;

  width: 58px;
  height: 58px;
}

#switch {
  right: 115px;
  bottom: 110px;

  width: 68px;
  height: 68px;
}

/* =========================
   MESSAGE
========================= */

#message {
  position: absolute;

  left: 50%;
  top: 75px;

  transform: translateX(-50%);

  z-index: 50;

  color: white;

  background: rgba(0,0,0,0.55);

  padding: 8px 14px;

  border-radius: 10px;

  font-size: 14px;

  white-space: nowrap;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  #game {
    max-width: 1100px;
    margin: auto;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="topbar">

    <div class="logo">
      LAWANG-GAMING
    </div>

    <div class="stats">
      Weapon:
      <span id="weapon">Rifle</span>
      |
      Ammo:
      <span id="ammo">30</span>/30
      |
      Hits:
      <span id="hits">0</span>
    </div>

  </div>

  <div id="message">
    LAWANG-GAMING DEMO
  </div>

  <div id="player"></div>

  <div id="crosshair"></div>

  <!-- TARGETS -->

  <div class="target"
       id="target1"
       style="left:25%;top:35%;">
  </div>

  <div class="target"
       id="target2"
       style="left:65%;top:30%;">
  </div>

  <div class="target"
       id="target3"
       style="left:50%;top:65%;">
  </div>

  <!-- MOVEMENT -->

  <button class="control" id="up">▲</button>
  <button class="control" id="down">▼</button>
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>

  <!-- ACTIONS -->

  <button class="action" id="fire">
    FIRE
  </button>

  <button class="action" id="reload">
    ↻
  </button>

  <button class="action" id="switch">
    GUN
  </button>

</div>

<script>

/* =========================================
   LAWANG-GAMING
   STANDALONE DEMO
========================================= */

const game =
  document.getElementById("game");

const player =
  document.getElementById("player");

const ammoText =
  document.getElementById("ammo");

const hitsText =
  document.getElementById("hits");

const weaponText =
  document.getElementById("weapon");

const message =
  document.getElementById("message");


let playerX = 50;
let playerY = 55;

let ammo = 30;
let hits = 0;

let weaponIndex = 0;

const weapons = [
  "Rifle",
  "SMG",
  "Shotgun"
];

const speed = 0.7;


/* =========================================
   PLAYER
========================================= */

function updatePlayer() {

  playerX =
    Math.max(
      5,
      Math.min(95, playerX)
    );

  playerY =
    Math.max(
      10,
      Math.min(90, playerY)
    );

  player.style.left =
    playerX + "%";

  player.style.top =
    playerY + "%";
}


/* =========================================
   MOVEMENT
========================================= */

function move(direction) {

  if (direction === "up") {
    playerY -= speed;
  }

  if (direction === "down") {
    playerY += speed;
  }

  if (direction === "left") {
    playerX -= speed;
  }

  if (direction === "right") {
    playerX += speed;
  }

  updatePlayer();
}


/* =========================================
   TOUCH CONTROL
========================================= */

function holdButton(
  element,
  direction
) {

  let timer = null;

  const start = (event) => {

    event.preventDefault();

    move(direction);

    timer =
      setInterval(
        () => move(direction),
        30
      );
  };

  const stop = () => {

    if (timer) {

      clearInterval(timer);

      timer = null;
    }
  };

  element.addEventListener(
    "touchstart",
    start,
    { passive:false }
  );

  element.addEventListener(
    "touchend",
    stop
  );

  element.addEventListener(
    "touchcancel",
    stop
  );

  element.addEventListener(
    "mousedown",
    start
  );

  element.addEventListener(
    "mouseup",
    stop
  );

  element.addEventListener(
    "mouseleave",
    stop
  );
}


holdButton(
  document.getElementById("up"),
  "up"
);

holdButton(
  document.getElementById("down"),
  "down"
);

holdButton(
  document.getElementById("left"),
  "left"
);

holdButton(
  document.getElementById("right"),
  "right"
);


/* =========================================
   FIRE
========================================= */

function fire() {

  if (ammo <= 0) {

    showMessage(
      "Out of ammo — Reload"
    );

    return;
  }

  ammo--;

  ammoText.innerText =
    ammo;

  /*
    Demo hit system:

    The crosshair is treated as the
    aiming point. We check whether
    a target's HEAD is close to it.
  */

  const targets =
    document.querySelectorAll(
      ".target"
    );

  let hit = false;

  const crossX =
    window.innerWidth / 2;

  const crossY =
    window.innerHeight / 2;


  targets.forEach(
    target => {

      if (
        target.classList.contains(
          "hit"
        )
      ) {

        return;
      }

      const rect =
        target.getBoundingClientRect();

      /*
        HEAD AREA ONLY
      */

      const headX =
        rect.left +
        rect.width / 2;

      const headY =
        rect.top -
        22 +
        17;

      const distance =
        Math.hypot(
          crossX - headX,
          crossY - headY
        );

      if (distance < 35) {

        target.classList.add(
          "hit"
        );

        hits++;

        hitsText.innerText =
          hits;

        hit = true;

        showMessage(
          "HEAD HIT!"
        );
      }

    }
  );


  if (!hit) {

    showMessage(
      "MISS"
    );

  }
}


/* =========================================
   FIRE BUTTON
========================================= */

const fireButton =
  document.getElementById("fire");

fireButton.addEventListener(
  "touchstart",
  event => {

    event.preventDefault();

    fire();

  },
  { passive:false }
);

fireButton.addEventListener(
  "click",
  fire
);


/* =========================================
   RELOAD
========================================= */

function reload() {

  ammo = 30;

  ammoText.innerText =
    ammo;

  showMessage(
    "Reloaded"
  );
}

document
  .getElementById("reload")
  .addEventListener(
    "click",
    reload
  );


/* =========================================
   WEAPON SWITCH
========================================= */

function switchWeapon() {

  weaponIndex++;

  if (
    weaponIndex >=
    weapons.length
  ) {

    weaponIndex = 0;
  }

  weaponText.innerText =
    weapons[weaponIndex];

  showMessage(
    "Weapon: " +
    weapons[weaponIndex]
  );
}

document
  .getElementById("switch")
  .addEventListener(
    "click",
    switchWeapon
  );


/* =========================================
   MESSAGE
========================================= */

let messageTimer = null;

function showMessage(text) {

  message.innerText =
    text;

  clearTimeout(
    messageTimer
  );

  messageTimer =
    setTimeout(
      () => {

        message.innerText =
          "LAWANG-GAMING DEMO";

      },
      1000
    );
}


/* =========================================
   START
========================================= */

updatePlayer();

</script>

</body>
</html>
